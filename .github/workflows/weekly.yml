name: Weekly

# Fails while the newest stable ghg of the action's major version has options
# ghg-options.json does not name, and runs the checks with it.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest:
    name: the newest ghg has no option the action lacks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.newest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./
      - id: newest
        run: echo "version=$(ghg --version | sed 's/^ghg //')" >> "$GITHUB_OUTPUT"
      - name: Compare its options with ghg-options.json
        run: ghg build --help | node tools/check_inputs.ts

  with-newest:
    name: the action's checks with the newest ghg
    needs: newest
    # newest fails when the newest ghg has an option the action lacks, which is when this job must still run.
    if: ${{ !cancelled() && needs.newest.outputs.version != '' }}
    uses: ./.github/workflows/action.yml
    with:
      ghg-version: ${{ needs.newest.outputs.version }}
