name: Site

# The action's own behaviour, the scenarios of features/, published as a ghg
# site on GitHub Pages by the publish action of this commit, ./publish, so
# that publishing itself is used as a person would use it (issue #19): a
# version for main, and one for each release, once release.yml has made it
# (issue #25), so that a tag the release refuses is never published. The
# previews of pull requests are preview.yml's.

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version-name:
        description: The release's tag, such as v1.0.0, which names its version of the site.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One run at a time for each branch or release; the action starts again
  # from the branch's newest commit when another reached it first
  # (docs/BEHAVIOUR.md, rule 22). A called workflow shares its caller's
  # github.ref, the tag, whose own group, in release.yml, is named apart.
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # docs/BEHAVIOUR.md, rules 20 and 22: reading how Pages is set, and pushing
    # to the branch it serves.
    name: publish the site
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./publish
        with:
          title: gherkin-glass-action's behaviour
          # Empty on a push to main, whose version the action names after the
          # branch (docs/BEHAVIOUR.md, rule 23).
          version-name: ${{ inputs.version-name }}
