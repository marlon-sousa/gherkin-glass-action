name: Preview

# A preview of the action's own site for each pull request, removed when it
# closes. A called workflow's jobs may not ask for more permissions than its
# caller grants, so this one, which needs pull-requests: write, stays apart
# from site.yml, which release.yml calls.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    name: preview the site
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./preview
        with:
          # The action adds ", pull request #<number>" itself.
          title: gherkin-glass-action's behaviour
