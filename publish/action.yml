name: gherkin-glass publish
description: Builds a version of the site of Gherkin feature files with ghg, and publishes it on the branch GitHub Pages serves.
author: marlon-sousa

# The inputs are the ones publish and preview share, and version-name; a test fails
# when they differ.

inputs:
  to:
    description: Where the site is published. github-pages, the only value today, is GitHub Pages deploying from a branch.
    required: false
    default: github-pages
  branch:
    description: The branch GitHub Pages serves, which the site is published on.
    required: false
    default: gh-pages
  folder:
    description: The folder of branch the site goes into, such as features. By default, the branch's root.
    required: false
    default: ""
  ghg-version:
    description: The release of ghg to install, such as 1.2.0. By default, the newest stable release of ghg of this action's major version.
    required: false
    default: ""
  token:
    description: The token that reads how Pages is set and pushes the branch, and lists the releases of ghg on github.com. By default, the workflow's own.
    required: false
    default: ${{ github.token }}
  config:
    description: The --config option of ghg build, the configuration file to read. Left out when empty.
    required: false
    default: ""
  input:
    description: The --input option of ghg build, the folder of feature files to read. Left out when empty.
    required: false
    default: ""
  title:
    description: The --title option of ghg build, the site's title. Left out when empty.
    required: false
    default: ""
  front-page:
    description: The --front-page option of ghg build, the Markdown template of the site's front page. Left out when empty.
    required: false
    default: ""
  keep-in-output:
    description: The patterns of what ghg leaves alone in the folder the site goes into, in the gitignore syntax, one on each line, passed to ghg build after /.nojekyll and /CNAME, which the action always keeps. When empty, the patterns of the configuration file's keep_in_output are passed instead.
    required: false
    default: ""
  version-name:
    description: The name of the version published. By default, the tag or branch that ran, with every / made a -.
    required: false
    default: ""

outputs:
  address:
    description: The address of the version published.

runs:
  using: node24
  main: ../dist/publish/index.cjs
