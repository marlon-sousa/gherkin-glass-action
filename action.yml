name: gherkin-glass
description: Installs ghg, the accessible static viewer for Gherkin feature files, and builds a site with it when asked.
author: marlon-sousa

# Besides ghg-version, build and token, every input is an option of ghg build of
# the same name, and a check fails when they differ.

branding:
  icon: book-open
  color: blue

inputs:
  ghg-version:
    description: The release of ghg to install, such as 1.2.0. By default, the newest stable release of ghg of this action's major version.
    required: false
    default: ""
  build:
    description: true to run ghg build after installing it, in the workspace folder.
    required: false
    default: "false"
  token:
    description: The token that lists the releases of ghg through GitHub's API, sent only on github.com. By default, the workflow's own.
    required: false
    default: ${{ github.token }}
  config:
    description: The --config option of ghg build, the configuration file to read. Left out when empty.
    required: false
    default: ""
  input:
    description: The --input option of ghg build, the folder of feature files to read. Left out when empty.
    required: false
    default: ""
  output:
    description: The --output option of ghg build, the folder the site is written into. Left out when empty.
    required: false
    default: ""
  title:
    description: The --title option of ghg build, the site's title. Left out when empty.
    required: false
    default: ""
  version-name:
    description: The --version-name option of ghg build, the version of the suite the site is built as. Left out when empty.
    required: false
    default: ""
  front-page:
    description: The --front-page option of ghg build, the Markdown template of the site's front page. Left out when empty.
    required: false
    default: ""
  only:
    description: The --only option of ghg build, the file listing the feature files to build the site from, alone. Left out when empty.
    required: false
    default: ""
  preview:
    description: true to give ghg build the --preview option, building a site without versions whose every page asks search engines not to index it. Left out when false or empty.
    required: false
    default: ""
  keep-in-output:
    description: The --keep-in-output option of ghg build, the patterns of what ghg leaves alone in the output folder, in the gitignore syntax, one on each line, each passed as one --keep-in-output. Left out when empty.
    required: false
    default: ""

outputs:
  ghg-version:
    description: The release of ghg installed, such as 1.2.0.
  site:
    description: The folder the build wrote the site into, relative to the workspace. Empty when the action does not build.

runs:
  using: node24
  main: dist/index.cjs
