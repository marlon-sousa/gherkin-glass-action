name: gherkin-glass
description: Installs ghg, the accessible viewer for Gherkin feature files, and builds and publishes a site with it when asked.
author: marlon-sousa

# docs/BEHAVIOUR.md says what this action does. Besides ghg-version, build,
# token, publish, publish-branch, publish-folder and changed-only, every input
# is an option of ghg build of the same name, and every option
# of ghg build that sets how a site is built is an input: src/policies/build_arguments.ts
# lists them, its test fails when an input here is not passed, and the job "the
# inputs against ghg build" of .github/workflows/action.yml fails when they differ
# from the options of the paired ghg.

branding:
  icon: book-open
  color: blue

inputs:
  ghg-version:
    description: The release of ghg to install, such as 1.2.0. By default, the newest stable release of ghg of this action's major version.
    required: false
    default: ""
  build:
    description: true to run ghg build after installing it, in the workspace folder.
    required: false
    default: "false"
  token:
    description: The token that lists the releases of ghg through GitHub's API, sent for that only on github.com, and that publishes the site, on the workflow's own server. By default, the workflow's own.
    required: false
    default: ${{ github.token }}
  publish:
    description: true to publish the site on the branch Pages serves, a version on a push, a preview of a pull request, removed when it closes.
    required: false
    default: "false"
  publish-branch:
    description: The branch Pages serves, which the site is published on.
    required: false
    default: gh-pages
  publish-folder:
    description: The folder of publish-branch the site goes into, such as features. By default, the branch's root.
    required: false
    default: ""
  changed-only:
    description: true for a pull request's preview to show only the feature files it changes, and for none to be published when it changes none.
    required: false
    default: "false"
  config:
    description: The --config option of ghg build, the configuration file to read. Left out when empty.
    required: false
    default: ""
  input:
    description: The --input option of ghg build, the folder of feature files to read. Left out when empty.
    required: false
    default: ""
  output:
    description: The --output option of ghg build, the folder the site is written into. Left out when empty.
    required: false
    default: ""
  title:
    description: The --title option of ghg build, the site's title. Left out when empty.
    required: false
    default: ""
  version-name:
    description: The --version-name option of ghg build, the version of the suite the site is built as. Left out when empty.
    required: false
    default: ""
  front-page:
    description: The --front-page option of ghg build, the Markdown template of the site's front page. Left out when empty.
    required: false
    default: ""
  only:
    description: The --only option of ghg build, the file listing the feature files to build the site from, alone. Left out when empty.
    required: false
    default: ""
  preview:
    description: true to give ghg build the --preview option, building a site without versions whose every page asks search engines not to index it. Left out when false or empty.
    required: false
    default: ""

runs:
  using: node24
  main: dist/index.cjs
